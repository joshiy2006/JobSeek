name: Daily Job Scraper

on:
  schedule:
    # 18:30 UTC = 00:00 IST
    - cron: '30 18 * * *'

  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/scraper

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Check runner IP
        run: | 
          curl -s https://api.ipify.org
          curl -s https://ipinfo.io/$(curl -s https://api.ipify.org)/json

      - name: Test with browser-like headers, verbose
        run: |
          curl -v --http1.1 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
            -H "Accept-Language: en-US,en;q=0.9" \
            -o response.html -w "STATUS:%{http_code} SIZE:%{size_download}\n" \
            https://www.naukri.com 2>&1 | tee curl_log.txt
      - name: Upload log and response
        uses: actions/upload-artifact@v4
        with:
          name: naukri-debug
          path: |
            response.html
            curl_log.txt

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: scrapy crawl naukri -s TWISTED_REACTOR="twisted.internet.asyncioreactor.AsyncioSelectorReactor" -s DOWNLOAD_HANDLERS='{"http":"scrapy_playwright.handler.ScrapyPlaywrightDownloadHandler","https":"scrapy_playwright.handler.ScrapyPlaywrightDownloadHandler"}'
