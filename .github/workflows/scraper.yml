name: Daily Naukri Scrape

on:
  schedule:
    # Runs at 18:30 UTC = 12:00 AM IST (next day)
    - cron: '30 18 * * *'
  workflow_dispatch:  # lets you trigger it manually from the Actions tab too

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: backend/scraper/naukri_scraper
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run spider
        working-directory: backend/scraper/naukri_scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: scrapy crawl naukri -a pages=1